[project]
name = "agent-harness-adk"
version = "0.1.4"
description = "A fast, lightweight harness for building production AI agents: agents, sub-agents, skills, prompts, tools, MCP, memory and the runtime rails underneath them."
readme = "README.md"
authors = [
    { name = "MuhammadHusnainAli", email = "muhammad.husnain.ali.738@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agents", "llm", "ai", "mcp", "orchestration", "anthropic", "openai", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]
# Ed25519-signed audit trails, verifiable by auditors with only the public key.
# Governance itself needs nothing extra: HMAC signing is in the standard library.
governance = ["cryptography>=42"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "jinja2>=3.1",   # optional at runtime; required to test the Jinja prompt path
]

[project.urls]
Homepage = "https://github.com/MuhammadHusnainAli/agent-harness-adk"
Issues = "https://github.com/MuhammadHusnainAli/agent-harness-adk/issues"

[project.scripts]
agent-harness = "agent_harness.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Published as agent-harness-adk, imported as agent_harness.
module-name = "agent_harness"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # An exception escaping a __del__ means we leaked a resource — a subprocess
    # transport closed after its loop, say. It is a bug, so fail on it rather
    # than printing it and moving on.
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
