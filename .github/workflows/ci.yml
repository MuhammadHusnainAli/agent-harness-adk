name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:        # the release workflow runs this before it publishes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"        # fail if uv.lock is out of date rather than silently relocking

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check src tests examples

  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - name: examples run without an API key
        run: |
          for example in examples/0*.py; do
            echo "--- $example"
            (cd examples && uv run python "$(basename "$example")" > /dev/null)
          done

  build:
    name: build + verify the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: the built wheel imports and runs on its own
        run: |
          uv run --isolated --no-project --with ./dist/*.whl python - <<'PY'
          import asyncio
          from agent_harness import Agent, FakeProvider, Harness, __version__

          async def main():
              provider = FakeProvider(["it works"])
              agent = Agent("smoke", provider=provider, model="claude-sonnet-5",
                            harness=Harness.testing(provider), memory=False)
              result = await agent.run("hello")
              assert result.output == "it works", result
              print("wheel smoke test passed on", __version__)

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
